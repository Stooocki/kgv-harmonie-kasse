<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KGV Harmonie – Kassenverwaltung 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tablericons/3.4.0/webfont/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:system-ui,sans-serif;font-size:13px;background:#F3F5F0;color:#1a1a1a}
table td{color:#1a1a1a}
.cd,.sc{color:#1a1a1a}
input,select,button{font-family:inherit}input:focus,select:focus{outline:2px solid #1F5C2E}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:205px;background:#1F5C2E;display:flex;flex-direction:column;flex-shrink:0}
.sb-top{padding:14px 12px 8px}.sb-top p{font-size:8px;color:#86EFAC;letter-spacing:1px;text-transform:uppercase;font-weight:500;margin-bottom:2px}
.sb-top h1{color:#fff;font-size:15px;font-weight:500}
.sbn{flex:1;padding:4px 6px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:6px;cursor:pointer;border:none;background:none;color:rgba(255,255,255,.85);font-size:13px;width:100%;text-align:left}
.ni:hover{background:rgba(255,255,255,.1);color:#fff}.ni.act{background:rgba(255,255,255,.18);color:#fff;font-weight:500}
.ni i{font-size:15px;width:16px;flex-shrink:0}.sep{height:1px;background:rgba(255,255,255,.12);margin:3px 6px}
.sbf{padding:8px 12px;border-top:1px solid rgba(255,255,255,.1)}.sbf p{font-size:9px;color:rgba(255,255,255,.35)}
.mn{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tb{background:#fff;border-bottom:.5px solid #E5E8E0;padding:0 16px;height:44px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb h2{font-size:14px;font-weight:500}.tbr{display:flex;align-items:center;gap:6px}
.ab{background:#1F5C2E;color:#fff;border:none;border-radius:6px;padding:5px 11px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:4px}
.ct{flex:1;overflow-y:auto;padding:14px 16px}
.kg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:14px}
.kc{background:#fff;border-radius:9px;padding:11px}.kc.g{background:#1F5C2E;color:#fff}
.kl{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:#6B7B5F;margin-bottom:3px}
.kc.g .kl{color:#86EFAC}.kv{font-size:17px;font-weight:500;color:#1a1a1a}.kc.g .kv{color:#fff}
.ks{font-size:9px;color:#6B7B5F;margin-top:2px}.kc.g .ks{color:#86EFAC}
.cd{background:#fff;border-radius:9px;overflow:hidden;margin-bottom:12px}
.ch{padding:9px 12px;border-bottom:.5px solid #eee;display:flex;justify-content:space-between;align-items:center}
.ch h3{font-size:12px;font-weight:500}
.fbr{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.fb{padding:2px 9px;border-radius:20px;border:.5px solid #D1D5CE;background:#fff;font-size:11px;font-weight:500;cursor:pointer;color:#6B7B5F}
.fb.on{background:#1F5C2E;color:#fff;border-color:#1F5C2E}
table{width:100%;border-collapse:collapse}
th{padding:6px 10px;text-align:left;font-size:9px;font-weight:500;color:#6B7B5F;text-transform:uppercase;letter-spacing:.4px;border-bottom:.5px solid #eee;background:#FAFAF8;white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:7px 10px;border-bottom:.5px solid #f3f3f1;vertical-align:middle;font-size:12px}tr:last-child td{border-bottom:none}
.tf{padding:7px 10px;border-top:.5px solid #eee;display:flex;justify-content:space-between;font-size:10px;color:#888;background:#FAFAF8}
.bd{display:inline-flex;align-items:center;padding:1px 6px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap}
.ok{background:#E8F5E9;color:#2E7D32}.of{background:#FEE2E2;color:#991B1B}
.pa{background:#FFF9C4;color:#7B5800}.ls{background:#F3F4F6;color:#9CA3AF}.eh{background:#EDE9FE;color:#5B21B6}
.pos{color:#2E7D32;font-weight:500}.neg{color:#991B1B;font-weight:500}
.bkb{background:none;border:none;color:#1F5C2E;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:0;margin-bottom:9px}
.dts{display:flex;border-bottom:.5px solid #E5E8E0;margin-bottom:12px}
.dtb{padding:7px 12px;border:none;background:none;cursor:pointer;font-size:12px;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px}
.dtb.on{color:#1F5C2E;border-bottom-color:#1F5C2E;font-weight:500}
.sc{background:#fff;border-radius:9px;padding:13px;margin-bottom:10px}
.sc h4{font-size:9px;font-weight:500;color:#6B7B5F;text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px;padding-bottom:6px;border-bottom:.5px solid #eee}
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.fl{font-size:9px;font-weight:500;color:#6B7B5F;text-transform:uppercase;letter-spacing:.4px}
.fi{padding:6px 9px;border-radius:6px;border:.5px solid #D1D5CE;font-size:13px;background:#fff;color:#1a1a1a;width:100%}
.fi.ro{background:#F8F9FA;color:#666}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px}
.rc{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:.5px solid #f3f3f1;font-size:12px}
.rc:last-child{border-bottom:none}.rc.tot{font-weight:500;border-top:.5px solid #ccc;border-bottom:none;padding-top:7px;margin-top:3px}.rc.sub{padding:2px 0 2px 14px;font-size:11px;color:#888;border-bottom:none}
.rc.rp{color:#2E7D32}.rc.rn{color:#991B1B;font-weight:500}
.bs{background:#1F5C2E;color:#fff;border:none;border-radius:6px;padding:6px 13px;font-size:12px;font-weight:500;cursor:pointer}
.bc{background:#f5f5f5;color:#444;border:.5px solid #D1D5CE;border-radius:6px;padding:6px 13px;font-size:12px;cursor:pointer}
.bpdf{background:#1F5C2E;color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:4px}
.sv{color:#2E7D32;font-size:11px;font-weight:500}
.bt{flex:1;padding:7px;border-radius:6px;border:.5px solid #D1D5CE;background:#fff;color:#333;font-size:12px;font-weight:500;cursor:pointer}
.bt.ag{background:#1F5C2E;color:#fff;border-color:#1F5C2E}.bt.ar{background:#991B1B;color:#fff;border-color:#991B1B}
.bsub{width:100%;padding:9px;background:#1F5C2E;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;margin-top:3px}
.bz{background:#E8F5E9;color:#2E7D32;padding:2px 8px;border-radius:4px;border:none;cursor:pointer;font-size:10px;font-weight:500}
.ba{background:#FEE2E2;color:#991B1B;padding:2px 8px;border-radius:4px;border:none;cursor:pointer;font-size:10px;font-weight:500}
.beh{background:#EDE9FE;color:#5B21B6;padding:2px 8px;border-radius:4px;border:none;cursor:pointer;font-size:10px;font-weight:500}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#FAFAF8;border-bottom:.5px solid #eee}
.sec-hdr h3{font-size:12px;font-weight:600}.sec-hdr span{font-size:10px;color:#888}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a1a;--card:#252525;--border:#333;--text:#e0e0e0;--muted:#999}}
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;height:58px;background:#1F5C2E;z-index:200;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bnav::-webkit-scrollbar{display:none}
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 12px;border:none;background:none;color:rgba(255,255,255,.7);font-size:9px;font-weight:500;cursor:pointer;white-space:nowrap;min-width:56px;flex-shrink:0;letter-spacing:.2px}
.bni i{font-size:18px;line-height:1}
.bni.act{color:#fff;background:rgba(255,255,255,.15);border-radius:8px;margin:4px 2px}
@media(max-width:700px){
  .sb{display:none}
  .bnav{display:flex}
  .ct{padding-bottom:70px}
  .kg{grid-template-columns:1fr 1fr}
  .g4{grid-template-columns:1fr 1fr}
  .tb{display:flex}
}
.bni.act i{color:#86EFAC}
</style>
</head>

</div>

  <button class="bni" data-p="neu"><i class="ti ti-circle-plus"></i>Neu</button>

</nav>

</div>
</div>

  // Mitglied aktualisieren

  // ZL 2026: G26-Eintrag aktualisieren (Name, Vorname, Anrede etc.)
  var g26idx=G26.findIndex(function(g){return String(g[0])===String(mbEdit);});

function doRestore(file){

        'kgv_sl_ov','kgv_sl_new','kgv_ku2','kgv_mb_ov','kgv_c'];

  }

  // ── Block 1: JA-Einnahmen aus ZL 2025 (in 2026 bezahlt) ─────────────────
  // G25_DETAIL: {gnr,pa,mb,bk,wa,sa,pfl,ges} mit kgv_o25 Overrides
  var jaKats={pa:0,mb:0,bk:0,wa:0,sa:0,pfl:0};
  G25_DETAIL.forEach(function(d){
    var g25=G25.find(function(g){return String(g[0])===String(d.gnr);});
    var bez=g25?g25Bez(g25):0;
    if(bez<=0)return;
    var ges=d.ges;
    if(ges<=0)return;
    // Pflichtstunden nur bei Vollzahlung (ganzzahlig, kein gebrochener Stundenbetrag)
    var vollzahlung=bez>=ges;
    if(vollzahlung){
      jaKats.pa =r2(jaKats.pa +d.pa);
      jaKats.mb =r2(jaKats.mb +d.mb);
      jaKats.bk =r2(jaKats.bk +d.bk);
      jaKats.wa =r2(jaKats.wa +d.wa);
      jaKats.sa =r2(jaKats.sa +d.sa);
      jaKats.pfl=r2(jaKats.pfl+d.pfl);
    } else {
      // Teilzahlung: nur die anderen Kategorien anteilig (ohne Pflichtstunden)
      var gesOhne=r2(d.pa+d.mb+d.bk+d.wa+d.sa);
      if(gesOhne<=0)return;
      var f=Math.min(1,bez/gesOhne);
      jaKats.pa=r2(jaKats.pa+r2(d.pa*f));
      jaKats.mb=r2(jaKats.mb+r2(d.mb*f));
      jaKats.bk=r2(jaKats.bk+r2(d.bk*f));
      jaKats.wa=r2(jaKats.wa+r2(d.wa*f));
      jaKats.sa=r2(jaKats.sa+r2(d.sa*f));
    }
  });
  var jaGes=r2(jaKats.pa+jaKats.mb+jaKats.bk+jaKats.wa+jaKats.sa+jaKats.pfl);
  var jaBez=jaGes;

  // ── Block 2: Einnahmen aus Neuvergaben 2026 (direkt aus NV-Daten) ───────────
  var nvBez=nv.filter(function(e){return e.bezahlt==='Ja';});
  var nvKats={mb:0,auf:0,kauf:0,sl:0};
  nvBez.forEach(function(e){
    nvKats.mb =r2(nvKats.mb +(e.mb||0));
    nvKats.auf=r2(nvKats.auf+(e.aufnahme||0));
    nvKats.kauf=r2(nvKats.kauf+(e.kaufpreis||0));
    nvKats.sl =r2(nvKats.sl +(e.sl||0));
  });
  var nvGes=r2(nvKats.mb+nvKats.auf+nvKats.kauf+nvKats.sl);

  // ── Block 3: Sonstige KB-Einnahmen (ohne JA- und NV-Kategorien) ──────────
  var skipKats=['Pacht','Flächenpacht','Jahresabrechnung (JA)','Mitgliedsbeitrag','Betriebskosten',

    'Umbuchung','Neuvergabe'];
  var sonstEin={};
  ents.filter(function(e){return e.art==='Einnahme'&&skipKats.indexOf(e.kat)<0;}).forEach(function(e){
    var k=e.kat||'Sonstiges';
    sonstEin[k]=(sonstEin[k]||0)+e.betrag;
  });
  var sonstEinArr=Object.keys(sonstEin).map(function(k){return{kat:k,sum:r2(sonstEin[k])};}).filter(function(x){return x.sum>0;});
  var sonstGes=r2(sonstEinArr.reduce(function(s,x){return s+x.sum;},0));

  // ── Block 3: Ausgaben aus Kassenbuch ─────────────────────────────────────
  var ausKats={};
  ents.filter(function(e){return e.art==='Ausgabe';}).forEach(function(e){
    var k=e.kat||'Sonstiges';

  });
  var ausArr=AKAT.filter(function(k){return ausKats[k];}).map(function(k){return{kat:k,sum:r2(ausKats[k])};});
  Object.keys(ausKats).forEach(function(k){if(AKAT.indexOf(k)<0&&ausKats[k])ausArr.push({kat:k,sum:r2(ausKats[k])});});

function kbCloseEdit(){var w=document.getElementById('KBEDIT_WRAP');if(w)w.remove();_editId=null;}
function kbSaveEdit(){
  if(!_editId)return;
  var upd={
    datum:document.getElementById('KBE_DAT').value,
    bez:document.getElementById('KBE_BEZ').value,
    betrag:parseFloat(document.getElementById('KBE_BET').value)||0,
    konto:document.getElementById('KBE_KTO').value,
    art:document.getElementById('KBE_ART').value,
    kat:document.getElementById('KBE_KAT').value
  };
  // Basis-Eintrag oder Extra?
  var isBase=_baseEnts.some(function(e){return e.id===_editId;});
  if(isBase){_eov[_editId]=upd;lsSet('kgv_e_ov',_eov);}
  else{_extra=_extra.map(function(e){return e.id===_editId?Object.assign({},e,upd):e;});lsSet('kgv_extra',_extra);}
  // ents neu aufbauen
  ents=_baseEnts.filter(function(e){return _delIds.indexOf(e.id)<0;}).map(function(e){return _eov[e.id]?Object.assign({},e,_eov[e.id]):e;}).concat(_extra);
  kbCloseEdit();rp();
}

function genJA(gnr){
  var g26=G26.find(function(g){return String(g[0])===String(gnr);});
  if(!g26){alert('Garten nicht gefunden');return;}
  var d=gd(gnr),c=calc(d);
  
  // Daten
  var anr=g26[2]||'',name=g26[3]||'',vor=g26[4]||'';
  var plz_ort=g26[5]||'',strasse=g26[6]||'';
  var m2=g26[1]||0;
  var wvb=Math.max(0,(d.ws||0)-(d.wv||0));   // Wasserverbrauch m³
  var svb=Math.max(0,(d.ss||0)-(d.sv||0));   // Stromverbrauch kWh
  var pfo=Math.max(0,8-(d.pg||0));            // offene Pflichtstunden
  var wGrund=d.wGrund||10,sGrund=d.sGrund||10;
  
  // Anrede personalisieren
  var anrede='Sehr geehrte'+(anr==='Frau'?'':'r')+' Gartenfreund'+(anr==='Frau'?'in':'')+'!';
  if(anr==='Frau')anrede='Sehr geehrte Frau '+name+'!';
  else if(anr==='Herrn'||anr==='Herr')anrede='Sehr geehrter Herr '+name+'!';
  
  // Beträge
  var pa=c.pa,bk=c.bk,mb=P.mb;
  var wa_verb=r2(wvb*P.wasser),sa_verb=r2(svb*P.strom),pfa=c.pfa;
  var rechBetrag=c.ges,portoBetrag=(d.ovj||0),ueberwBetrag=r2(c.ges-(d.bb||0));
  
  var datum=new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  var jaJahr=2026,naechstJahr=2027;

      +'<td style="text-align:right;white-space:nowrap">'+eu2(val)+'</td>'

  // Inhalt der JA zusammenbauen

    +'<p>'+anrede+'</p>'

    +'<style>table.ja{width:100%;border-collapse:collapse}.ja td{padding:3px 6px}.ja .sep{border-top:1px solid #000}.ja .tot td{text-decoration:underline}.ja .btot td{font-weight:bold;text-decoration:underline}.ja .ind{padding-left:28px}</style>'

    +row('Mitgliedsbeitrag '+naechstJahr,mb)
    +row('Werterhaltungs-/Betriebskosten '+naechstJahr+' (0,12 €/m²)',bk)
    +(svb>0
      ?row('Stromverbrauch '+jaJahr+': '+svb.toFixed(2)+' kWh x 0,40 €/kWh',sa_verb)
       +row('Grundbetrag',sGrund,true)
      :row('Stromverbrauch '+jaJahr+': 0 kWh (Grundbetrag)',sGrund))
    +(wvb>0
      ?row('Wasserverbrauch '+jaJahr+': '+wvb.toFixed(3)+' m³ x 2,15 €/m³',wa_verb)
       +row('Grundbetrag',wGrund,true)
      :row('Wasserverbrauch '+jaJahr+': 0 m³ (Grundbetrag)',wGrund))
    +row('nicht geleistete Pflichtstunden '+jaJahr+': '+pfo+' x 20 €/Std.',pfa)
    +(c.sb>0?row((d.sTxt||'Sonstiges'),c.sb):'')

    +'<table class="ja tot"><tr><td>Rechnungsbetrag</td><td style="text-align:right;text-decoration:underline">'+eu2(rechBetrag)+'</td></tr></table>'
    +(c.ovj>0?'<table class="ja"><tr><td>offene Forderung</td><td style="text-align:right">'+eu2(c.ovj)+'</td></tr></table>':'<p style="margin:3px 0">offene Forderung</p>')
    +'<table class="ja"><tr><td>Porto Jahresrechnung</td><td style="text-align:right">'+eu2(portoBetrag)+'</td></tr></table>'
    +'<table class="ja btot" style="margin-top:4px"><tr><td>Überweisungsbetrag</td><td style="text-align:right">'+eu2(ueberwBetrag)+'</td></tr></table>'

<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.min.js"></script>
<script>
(function() {
  var CFG = {
    apiKey: 'AIzaSyBqjjXmgTuhO3TjkoFG8jyDURCR1-wVrWE',
    authDomain: 'kgv-kasse-harmonie.firebaseapp.com',
    databaseURL: 'https://kgv-kasse-harmonie-default-rtdb.europe-west1.firebasedatabase.app',
    projectId: 'kgv-kasse-harmonie',
    appId: '1:706561551131:web:89ead9d04ec3e0b86b01be'
  };
  var DB = CFG.databaseURL + '/kgv';
  var KEYS = ['kgv_extra','kgv_del','kgv_e_ov','kgv_o','kgv_o25',
    'kgv_nv_ov','kgv_nv_new','kgv_sl_ov','kgv_sl_new','kgv_ku2','kgv_mb_ov','kgv_c'];

  // Status-Anzeige
  var dot = document.createElement('div');
  dot.style.cssText = 'position:fixed;bottom:66px;right:8px;font-size:9px;color:#888;'
    + 'z-index:9999;padding:2px 8px;background:rgba(255,255,255,.95);border-radius:8px;'
    + 'border:1px solid #ddd;pointer-events:none;transition:opacity .3s';
  dot.textContent = '...';
  document.body.appendChild(dot);
  function show(t, fade) {
    dot.style.opacity = '1'; dot.textContent = t;
    if (fade) setTimeout(function() { dot.style.opacity = '0.3'; }, 2500);
  }

  var authToken = null;
  var origSet = localStorage.setItem.bind(localStorage);
  var timer, lastOwn = 0;

  function headers() {
    var h = { 'Content-Type': 'application/json' };
    return h;
  }

  function dbUrl(path) {
    var url = DB + (path || '') + '.json';
    if (authToken) url += '?auth=' + authToken;
    return url;
  }

  function allData() {
    var d = { _ts: Date.now() };
    KEYS.forEach(function(k) {
      var v = localStorage.getItem(k);
      if (v) { try { d[k] = JSON.parse(v); } catch(x) {} }
    });
    return d;
  }

  function push() {
    var data = allData();
    lastOwn = data._ts;
    show('...');
    fetch(dbUrl(), { method: 'PUT', headers: headers(), body: JSON.stringify(data) })
      .then(function(r) {
        if (r.ok) {
          origSet('kgv_ts', String(data._ts));
          var d = new Date(data._ts);
          show((d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes(), true);
        } else { show('Err '+r.status, true); }
      }).catch(function() { show('Offline', true); });
  }

  function checkCloud(manual) {
    if (manual) show('...');
    fetch(dbUrl('/_ts'))
      .then(function(r) { return r.json(); })
      .then(function(cTs) {
        var lTs = parseInt(localStorage.getItem('kgv_ts') || '0');
        if (cTs && cTs > lTs && Date.now() - lastOwn > 3000) {
          show('Lade...');
          fetch(dbUrl()).then(function(r) { return r.json(); }).then(function(d) {
            if (!d) return;
            KEYS.forEach(function(k) {
              if (d[k] !== undefined) origSet(k, JSON.stringify(d[k]));
            });
            origSet('kgv_ts', String(cTs));
            show('OK');
            setTimeout(function() { location.reload(); }, 500);
          });
        } else { show(new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}), true); }
      }).catch(function() { show('?'); });
  }

  localStorage.setItem = function(k, v) {
    origSet(k, v);
    if (k && k.indexOf('kgv_') === 0 && k !== 'kgv_ts') {
      clearTimeout(timer);
      timer = setTimeout(push, 1500);
    }
  };

  // Firebase Auth: Anonymous Sign-In für dauerhaften Zugriff
  try {
    firebase.initializeApp(CFG);
    firebase.auth().signInAnonymously()
      .then(function(result) {
        return result.user.getIdToken();
      })
      .then(function(token) {
        authToken = token;
        // Token alle 55 Min. erneuern
        setInterval(function() {
          firebase.auth().currentUser.getIdToken(true).then(function(t) { authToken = t; });
        }, 55 * 60 * 1000);
        checkCloud(false);
        setInterval(function() { if (!document.hidden) checkCloud(false); }, 10000);
        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) checkCloud(false);
        });
      })
      .catch(function(e) {
        // Fallback: ohne Auth (solange Regeln noch offen sind)
        console.warn('Auth fehlgeschlagen, versuche ohne Auth:', e.message);
        checkCloud(false);
        setInterval(function() { if (!document.hidden) checkCloud(false); }, 10000);
      });
  } catch(e) {
    console.warn('Firebase init fehlgeschlagen:', e);
  }
})();
</script>

<script>
(function(){
  var B='https://kgv-kasse-harmonie-default-rtdb.europe-west1.firebasedatabase.app/kgv';
  var KEYS=['kgv_extra','kgv_del','kgv_e_ov','kgv_o','kgv_o25','kgv_nv_ov','kgv_nv_new','kgv_sl_ov','kgv_sl_new','kgv_ku2','kgv_mb_ov','kgv_c'];
  var oSet=localStorage.setItem.bind(localStorage);
  function enc(o){if(!o||typeof o!=='object'||Array.isArray(o))return o;var r={};Object.keys(o).forEach(function(k){r[k.replace(/\//g,'__')]=enc(o[k]);});return r;}
  function dec(o){if(!o||typeof o!=='object'||Array.isArray(o))return o;var r={};Object.keys(o).forEach(function(k){r[k.replace(/__/g,'/')]=dec(o[k]);});return r;}
  function put(p,v){return fetch(B+'/'+p+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});}
  function get(p){return fetch(B+'/'+p+'.json',{cache:'no-store'}).then(function(r){return r.json();});}
  var btn=document.createElement('button');
  btn.innerHTML='&#8645; Sync';
  btn.style.cssText='position:fixed;bottom:66px;right:8px;z-index:9999;padding:4px 10px;background:#1F5C2E;color:#fff;border:none;border-radius:8px;font-size:11px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)';
  document.body.appendChild(btn);
  function sb(t,c){btn.innerHTML=t;btn.style.background=c||'#1F5C2E';}
  btn.onclick=function(){
    sb('...','#555');
    get('_ts').then(function(cTs){
      var lFb=parseInt(localStorage.getItem('kgv_fb_ts')||'0');
      if(cTs&&cTs>lFb){
        sb('Lade...','#555');
        Promise.all(KEYS.map(function(k){
          return get(k).then(function(v){if(v!=null)oSet(k,JSON.stringify(dec(v)));});
        })).then(function(){
          oSet('kgv_fb_ts',String(cTs));
          sb('&#10003; OK','#2E7D32');
          setTimeout(function(){location.reload();},800);
        }).catch(function(){sb('Err','#991b1b');});
      }else{
        sb('Sende...','#555');
        var ts=Date.now();
        var ps=KEYS.map(function(k){
          var v=localStorage.getItem(k);
          if(!v)return Promise.resolve();
          var val;try{val=enc(JSON.parse(v));}catch(x){return Promise.resolve();}
          return put(k,val);
        });
        ps.push(put('_ts',ts));
        Promise.all(ps).then(function(rs){
          var bad=rs.filter(function(r){return r&&!r.ok;});
          if(!bad.length){
            oSet('kgv_fb_ts',String(ts));
            sb('&#8645; Sync');
            btn.title=new Date(ts).toLocaleTimeString('de-DE');
          }else{
            bad[0].text().then(function(t){console.error('FB '+bad[0].status+':',t);});
            sb('Err '+bad[0].status,'#991b1b');
            setTimeout(function(){sb('&#8645; Sync');},3000);
          }
        }).catch(function(e){console.error(e);sb('Offline','#991b1b');});
      }
    }).catch(function(e){console.error(e);sb('Offline','#991b1b');});
  };
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KGV Harmonie – Kassenverwaltung 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tablericons/3.4.0/webfont/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:system-ui,sans-serif;font-size:13px;background:#F3F5F0;color:#1a1a1a}
table td{color:#1a1a1a}
.cd,.sc{color:#1a1a1a}
input,select,button{font-family:inherit}input:focus,select:focus{outline:2px solid #1F5C2E}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:205px;background:#1F5C2E;display:flex;flex-direction:column;flex-shrink:0}
.sb-top{padding:14px 12px 8px}.sb-top p{font-size:8px;color:#86EFAC;letter-spacing:1px;text-transform:uppercase;font-weight:500;margin-bottom:2px}
.sb-top h1{color:#fff;font-size:15px;font-weight:500}
.sbn{flex:1;padding:4px 6px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:6px;cursor:pointer;border:none;background:none;color:rgba(255,255,255,.85);font-size:13px;width:100%;text-align:left}
.ni:hover{background:rgba(255,255,255,.1);color:#fff}.ni.act{background:rgba(255,255,255,.18);color:#fff;font-weight:500}
.ni i{font-size:15px;width:16px;flex-shrink:0}.sep{height:1px;background:rgba(255,255,255,.12);margin:3px 6px}
.sbf{padding:8px 12px;border-top:1px solid rgba(255,255,255,.1)}.sbf p{font-size:9px;color:rgba(255,255,255,.35)}
.mn{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tb{background:#fff;border-bottom:.5px solid #E5E8E0;padding:0 16px;height:44px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb h2{font-size:14px;font-weight:500}.tbr{display:flex;align-items:center;gap:6px}
.ab{background:#1F5C2E;color:#fff;border:none;border-radius:6px;padding:5px 11px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:4px}
.ct{flex:1;overflow-y:auto;padding:14px 16px}
.kg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:14px}
.kc{background:#fff;border-radius:9px;padding:11px}.kc.g{background:#1F5C2E;color:#fff}
.kl{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:#6B7B5F;margin-bottom:3px}
.kc.g .kl{color:#86EFAC}.kv{font-size:17px;font-weight:500;color:#1a1a1a}.kc.g .kv{color:#fff}
.ks{font-size:9px;color:#6B7B5F;margin-top:2px}.kc.g .ks{color:#86EFAC}
.cd{background:#fff;border-radius:9px;overflow:hidden;margin-bottom:12px}
.ch{padding:9px 12px;border-bottom:.5px solid #eee;display:flex;justify-content:space-between;align-items:center}
.ch h3{font-size:12px;font-weight:500}
.fbr{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.fb{padding:2px 9px;border-radius:20px;border:.5px solid #D1D5CE;background:#fff;font-size:11px;font-weight:500;cursor:pointer;color:#6B7B5F}
.fb.on{background:#1F5C2E;color:#fff;border-color:#1F5C2E}
table{width:100%;border-collapse:collapse}
th{padding:6px 10px;text-align:left;font-size:9px;font-weight:500;color:#6B7B5F;text-transform:uppercase;letter-spacing:.4px;border-bottom:.5px solid #eee;background:#FAFAF8;white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:7px 10px;border-bottom:.5px solid #f3f3f1;vertical-align:middle;font-size:12px}tr:last-child td{border-bottom:none}
.tf{padding:7px 10px;border-top:.5px solid #eee;display:flex;justify-content:space-between;font-size:10px;color:#888;background:#FAFAF8}
.bd{display:inline-flex;align-items:center;padding:1px 6px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap}
.ok{background:#E8F5E9;color:#2E7D32}.of{background:#FEE2E2;color:#991B1B}
.pa{background:#FFF9C4;color:#7B5800}.ls{background:#F3F4F6;color:#9CA3AF}.eh{background:#EDE9FE;color:#5B21B6}
.pos{color:#2E7D32;font-weight:500}.neg{color:#991B1B;font-weight:500}
.bkb{background:none;border:none;color:#1F5C2E;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:0;margin-bottom:9px}
.dts{display:flex;border-bottom:.5px solid #E5E8E0;margin-bottom:12px}
.dtb{padding:7px 12px;border:none;background:none;cursor:pointer;font-size:12px;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px}
.dtb.on{color:#1F5C2E;border-bottom-color:#1F5C2E;font-weight:500}
.sc{background:#fff;border-radius:9px;padding:13px;margin-bottom:10px}
.sc h4{font-size:9px;font-weight:500;color:#6B7B5F;text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px;padding-bottom:6px;border-bottom:.5px solid #eee}
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.fl{font-size:9px;font-weight:500;color:#6B7B5F;text-transform:uppercase;letter-spacing:.4px}
.fi{padding:6px 9px;border-radius:6px;border:.5px solid #D1D5CE;font-size:13px;background:#fff;color:#1a1a1a;width:100%}
.fi.ro{background:#F8F9FA;color:#666}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px}
.rc{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:.5px solid #f3f3f1;font-size:12px}
.rc:last-child{border-bottom:none}.rc.tot{font-weight:500;border-top:.5px solid #ccc;border-bottom:none;padding-top:7px;margin-top:3px}.rc.sub{padding:2px 0 2px 14px;font-size:11px;color:#888;border-bottom:none}
.rc.rp{color:#2E7D32}.rc.rn{color:#991B1B;font-weight:500}
.bs{background:#1F5C2E;color:#fff;border:none;border-radius:6px;padding:6px 13px;font-size:12px;font-weight:500;cursor:pointer}
.bc{background:#f5f5f5;color:#444;border:.5px solid #D1D5CE;border-radius:6px;padding:6px 13px;font-size:12px;cursor:pointer}
.bpdf{background:#1F5C2E;color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:4px}
.sv{color:#2E7D32;font-size:11px;font-weight:500}
.bt{flex:1;padding:7px;border-radius:6px;border:.5px solid #D1D5CE;background:#fff;color:#333;font-size:12px;font-weight:500;cursor:pointer}
.bt.ag{background:#1F5C2E;color:#fff;border-color:#1F5C2E}.bt.ar{background:#991B1B;color:#fff;border-color:#991B1B}
.bsub{width:100%;padding:9px;background:#1F5C2E;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;margin-top:3px}
.bz{background:#E8F5E9;color:#2E7D32;padding:2px 8px;border-radius:4px;border:none;cursor:pointer;font-size:10px;font-weight:500}
.ba{background:#FEE2E2;color:#991B1B;padding:2px 8px;border-radius:4px;border:none;cursor:pointer;font-size:10px;font-weight:500}
.beh{background:#EDE9FE;color:#5B21B6;padding:2px 8px;border-radius:4px;border:none;cursor:pointer;font-size:10px;font-weight:500}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#FAFAF8;border-bottom:.5px solid #eee}
.sec-hdr h3{font-size:12px;font-weight:600}.sec-hdr span{font-size:10px;color:#888}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a1a;--card:#252525;--border:#333;--text:#e0e0e0;--muted:#999}}
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;height:58px;background:#1F5C2E;z-index:200;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bnav::-webkit-scrollbar{display:none}
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 12px;border:none;background:none;color:rgba(255,255,255,.7);font-size:9px;font-weight:500;cursor:pointer;white-space:nowrap;min-width:56px;flex-shrink:0;letter-spacing:.2px}
.bni i{font-size:18px;line-height:1}
.bni.act{color:#fff;background:rgba(255,255,255,.15);border-radius:8px;margin:4px 2px}
@media(max-width:700px){
  .sb{display:none}
  .bnav{display:flex}
  .ct{padding-bottom:70px}
  .kg{grid-template-columns:1fr 1fr}
  .g4{grid-template-columns:1fr 1fr}
  .tb{display:flex}
}
.bni.act i{color:#86EFAC}
</style>
</head>

<div class="app">
<div class="sb">
  <div class="sb-top"><p>Kleingartenanlage</p><h1>KGV Harmonie</h1></div>
  <nav class="sbn" id="SBN">
    <button class="ni act" data-p="dash"><i class="ti ti-home"></i><span>Dashboard</span></button>
    <button class="ni" data-p="kb"><i class="ti ti-notebook"></i><span>Kassenbuch</span></button>
    <button class="ni" data-p="neu"><i class="ti ti-circle-plus"></i><span>Neue Buchung</span></button>
    <button class="ni" data-p="mitgl"><i class="ti ti-users"></i><span>Mitglieder</span></button>
    <div class="sep"></div>
    <button class="ni" data-p="zl25"><i class="ti ti-calendar-check"></i><span>Zahlungsliste 2025</span></button>
    <button class="ni" data-p="zl26"><i class="ti ti-calendar-event"></i><span>Zahlungsliste 2026</span></button>
    <button class="ni" data-p="nv"><i class="ti ti-transfer"></i><span>Neuvergaben 2026</span></button>
    <button class="ni" data-p="kaution"><i class="ti ti-lock"></i><span>Kautionen</span></button>
    <div class="sep"></div>
    <button class="ni" data-p="cfg"><i class="ti ti-settings"></i><span>Einstellungen</span></button>
  </nav>
  <div class="sbf"><p>Zwickau · 2026</p></div>
</div>
<nav class="bnav" id="BNAV">
  <button class="bni act" data-p="dash"><i class="ti ti-home"></i>Dashboard</button>
  <button class="bni" data-p="kb"><i class="ti ti-notebook"></i>Kassenbuch</button>
  <button class="bni" data-p="neu"><i class="ti ti-circle-plus"></i>Neu</button>
  <button class="bni" data-p="mitgl"><i class="ti ti-users"></i>Mitglieder</button>
  <button class="bni" data-p="zl26"><i class="ti ti-calendar-event"></i>ZL 2026</button>
  <button class="bni" data-p="zl25"><i class="ti ti-calendar-check"></i>ZL 2025</button>
  <button class="bni" data-p="nv"><i class="ti ti-transfer"></i>Vergaben</button>
  <button class="bni" data-p="kaution"><i class="ti ti-lock"></i>Kautionen</button>
  <button class="bni" data-p="cfg"><i class="ti ti-settings"></i>Einst.</button>
</nav>
<div class="mn">
  <div class="tb">
    <h2 id="TBT">Dashboard</h2>
    <div class="tbr">
      <button class="ab" id="NVAB" style="display:none" onclick="A.nvNew()"><i class="ti ti-user-plus"></i>Neuvergabe</button>
      <button class="ab" id="KUAB" style="display:none" onclick="A.kuNew()"><i class="ti ti-user-minus"></i>Kündigung</button>
      <button class="ab" id="KNAB" style="display:none" onclick="A.slNew()"><i class="ti ti-plus"></i>Kaution</button>
      <button class="ab" id="PAB" style="display:none" onclick="A.pAll()"><i class="ti ti-printer"></i>Alle PDFs</button>
    </div>
  </div>
  <div class="ct" id="CT"></div>
</div>
</div>

    +'<button class="fb'+(mbfl.status==='leer'?' on':'')+'" data-v="leer" onclick="A.mbFl(this.dataset.v)">Leerstand ('+members.filter(function(m){return m.leer;}).length+')</button>'
    +'</div>'
    +'<input class="fi" id="MB_SUCHE" placeholder="🔍 Name oder G-Nr. suchen..." value="'+mbfl.suche+'" style="flex:1;min-width:180px;max-width:300px;padding:5px 9px;font-size:12px">'
    +'<span style="font-size:11px;color:#888;white-space:nowrap">'+d.length+' / '+members.length+' Gärten</span>'
    +'</div>'
    +'<div class="cd" style="overflow-x:auto"><table style="min-width:650px;width:100%;border-collapse:collapse">'
    +'<thead><tr style="background:#FAFAF8">'
    +'<th style="padding:6px 8px;text-align:left;font-size:9px;color:#6B7B5F;text-transform:uppercase;border-bottom:.5px solid #eee">Nr.</th>'
    +'<th style="padding:6px 8px;text-align:left;font-size:9px;color:#6B7B5F;text-transform:uppercase;border-bottom:.5px solid #eee">Status</th>'
    +'<th style="padding:6px 8px;text-align:left;font-size:9px;color:#6B7B5F;text-transform:uppercase;border-bottom:.5px solid #eee">Name</th>'
    +'<th style="padding:6px 8px;text-align:left;font-size:9px;color:#6B7B5F;text-transform:uppercase;border-bottom:.5px solid #eee">Vorname</th>'
    +'<th style="padding:6px 8px;text-align:right;font-size:9px;color:#6B7B5F;text-transform:uppercase;border-bottom:.5px solid #eee">m²</th>'
    +'<th style="padding:6px 8px;text-align:left;font-size:9px;color:#6B7B5F;text-transform:uppercase;border-bottom:.5px solid #eee">E-Mail</th>'
    +'<th style="padding:6px 8px;text-align:left;font-size:9px;color:#6B7B5F;text-transform:uppercase;border-bottom:.5px solid #eee">Telefon</th>'
    +'<th style="padding:6px 8px;text-align:left;font-size:9px;color:#6B7B5F;text-transform:uppercase;border-bottom:.5px solid #eee">Notiz</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div style="padding:7px 10px;border-top:.5px solid #eee;font-size:10px;color:#888;background:#FAFAF8">'+d.length+' Einträge angezeigt</div>'
    +'</div>'
    // Edit-Modal Platzhalter
    +'<div id="MB_MODAL" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;overflow-y:auto;padding:20px">'
    +'<div style="background:#fff;border-radius:12px;max-width:520px;margin:0 auto;padding:20px" onclick="event.stopPropagation()">'
    +'<div id="MB_MODAL_CONTENT"></div>'
    +'</div></div>';
}

function mbBind(){
  var el=document.getElementById('MB_SUCHE');
  if(el)el.oninput=function(){mbfl.suche=this.value;rp();};
  // Modal-Backdrop schließt Modal
  var modal=document.getElementById('MB_MODAL');
  if(modal)modal.onclick=function(){mbClose();};
}

function mbFl(v){mbfl.status=v;rp();}

function mbOpen(gnr){
  var m=members.find(function(x){return x.gnr===gnr;});
  if(!m)return;
  mbEdit=gnr;
  var c=document.getElementById('MB_MODAL_CONTENT');
  if(!c)return;
  c.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'
    +'<strong style="font-size:15px;color:#1F5C2E">Garten '+m.gnr+' bearbeiten</strong>'
    +'<button onclick="A.mbClose()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#888">✕</button>'
    +'</div>'
    +(m.leer?'<div style="background:#FFF8E1;border-left:3px solid #F59E0B;padding:8px 10px;border-radius:4px;margin-bottom:12px;font-size:12px;color:#92400E">Leerstand – Pächter kann hier eingetragen werden</div>':'')
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    +mbFeld('Anrede','MB_ANR',m.anr,'text','z.B. Frau / Herrn')
    +mbFeld('Name (Nachname)','MB_NAME',m.name,'text','')
    +mbFeld('Vorname','MB_VOR',m.vor,'text','')
    +mbFeld('Telefon','MB_TEL',m.tel,'tel','')
    +'</div>'
    +'<div style="margin-top:10px">'
    +mbFeld('E-Mail','MB_EMAIL',m.email,'email','')
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">'
    +mbFeld('Straße','MB_STR',m.str,'text','')
    +mbFeld('PLZ / Ort','MB_PLZORT',m.plz_ort,'text','')
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">'
    +mbFeld('Geburtsdatum','MB_GEB',m.geb,'text','TT.MM.JJJJ')
    +mbFeld('Gartenfläche m²','MB_M2',m.m2,'number','')
    +'</div>'
    +'<div style="margin-top:10px">'
    +'<label style="font-size:11px;color:#6B7B5F;font-weight:500;text-transform:uppercase;letter-spacing:.5px">Notiz</label>'
    +'<textarea id="MB_NOTIZ" rows="3" style="width:100%;margin-top:4px;padding:7px 9px;border:.5px solid #ddd;border-radius:6px;font-size:12px;font-family:inherit;resize:vertical">'+m.notiz+'</textarea>'
    +'</div>'
    +'<div style="margin-top:16px;display:flex;gap:8px">'
    +'<button onclick="A.mbSave()" style="flex:1;background:#1F5C2E;color:#fff;border:none;border-radius:7px;padding:10px;font-size:13px;font-weight:600;cursor:pointer">Speichern → ZL 2026</button>'
    +'<button onclick="A.mbClose()" style="background:#f0ede8;color:#555;border:none;border-radius:7px;padding:10px 16px;font-size:13px;cursor:pointer">Abbrechen</button>'
    +'</div>';
  document.getElementById('MB_MODAL').style.display='block';
}

function mbFeld(lbl,id,val,typ,ph){
  return '<div>'
    +'<label style="font-size:11px;color:#6B7B5F;font-weight:500;text-transform:uppercase;letter-spacing:.5px">'+lbl+'</label>'
    +'<input id="'+id+'" type="'+typ+'" value="'+(val||'')+'" placeholder="'+ph+'" '
    +'style="width:100%;margin-top:4px;padding:7px 9px;border:.5px solid #ddd;border-radius:6px;font-size:12px;box-sizing:border-box">'
    +'</div>';
}

function mbSave(){
  if(!mbEdit)return;
  var m=members.find(function(x){return x.gnr===mbEdit;});
  if(!m)return;

  var ov={
    anr: document.getElementById('MB_ANR').value.trim(),
    name: document.getElementById('MB_NAME').value.trim(),
    vor: document.getElementById('MB_VOR').value.trim(),
    tel: document.getElementById('MB_TEL').value.trim(),
    email: document.getElementById('MB_EMAIL').value.trim(),
    str: document.getElementById('MB_STR').value.trim(),
    plz_ort: document.getElementById('MB_PLZORT').value.trim(),
    geb: document.getElementById('MB_GEB').value.trim(),
    m2: parseInt(document.getElementById('MB_M2').value)||m.m2,
    notiz: document.getElementById('MB_NOTIZ').value.trim(),
    leer: !document.getElementById('MB_NAME').value.trim()
  };

  _mbOv[mbEdit]=ov;
  lsSet('kgv_mb_ov',_mbOv);

  // Mitglied aktualisieren
  var idx=members.findIndex(function(x){return x.gnr===mbEdit;});
  if(idx>=0)members[idx]=Object.assign({},members[idx],ov);

  // ZL 2026: G26-Eintrag aktualisieren (Name, Vorname, Anrede etc.)
  var g26idx=G26.findIndex(function(g){return String(g[0])===String(mbEdit);});
  if(g26idx>=0){
    G26[g26idx][2]=ov.anr;
    G26[g26idx][3]=ov.name;
    G26[g26idx][4]=ov.vor;
    G26[g26idx][5]=ov.plz_ort;
    G26[g26idx][6]=ov.str;
    G26[g26idx][7]=ov.email;
    if(ov.m2)G26[g26idx][1]=ov.m2;
  }

  mbClose();
  rp();
}

function mbClose(){
  var modal=document.getElementById('MB_MODAL');
  if(modal)modal.style.display='none';
  mbEdit=null;
}

window.A={nav:nav,mbFl:mbFl,mbOpen:mbOpen,mbSave:mbSave,mbClose:mbClose,rp:rp,pAll:pAll,pja:pja,setFl:setFl,setSfl:setSfl,openDet:openDet,closeDet:closeDet,setDtb:setDtb,svd:svd,qset:qset,qbuch:qbuch,nset:nset,nsave:nsave,nvNew:nvNew,nvSt:nvSt,nvCalc:nvCalc,nvSave:nvSave,kuNew:kuNew,kuSave:kuSave,slSt:slSt,slNew:slNew,slSave:slSave,scfg:scfg,p25Form:p25Form,p25Preview:p25Preview,p25Save:p25Save,p25Reset:p25Reset,kbFl:kbFl,kbSearch:kbSearch,kbDel:kbDel};
document.querySelectorAll('.ni,.bni').forEach(function(b){b.addEventListener('click',function(){nav(b.dataset.p);});});
nav('dash');
})();
</script>
